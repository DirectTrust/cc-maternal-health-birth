name: Deploy VitePress site to Pages

# One Pages site, several builds (see scripts/build-site.sh):
#   /                 main      -- current published version (a placeholder until the first release)
#   /develop/         develop   -- DRAFT preview of the next version
#   /<tag>/           every git tag -- archived versions
# Any change to main or develop, or a published release, rebuilds and redeploys all of it.
on:
  push:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always run the build tooling from develop. Before the first release main holds only
          # repo scaffolding (this workflow), so a push to main must still use develop's scripts.
          # The scripts then build main, develop and every tag from their own refs.
          ref: develop
          fetch-depth: 0 # all branches + tags: needed to build them and for lastUpdated in VitePress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build all versions
        env:
          GH_TOKEN: ${{ github.token }} # the Version History page reads release descriptions
        run: scripts/build-site.sh site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
